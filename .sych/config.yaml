# Repository policy of Sych reviewing itself; read from the target tip, a PR cannot change its own.
schema_version: 1
review:
  language: en
  # Eval cases and golden files plant defects on purpose; a claim anchored only there is not
  # about the product.
  fixture_paths: ["eval/**", "fixtures/**"]
ci:
  wait_seconds: 900
  expected_reports:
    - id: clippy
      applies_to: ["crates/**", "Cargo.toml", "Cargo.lock"]
      format: cargo_json
    - id: check
      applies_to: ["**"]
      format: sych_manifest
