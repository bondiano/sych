# Shared CLI toolchain for developers and CI (`mise install`).
min_version = "2026.11.0"

[tools]
just = "1.59.0"
"cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
jactionlint = "2.6.0"
"github:sbdchd/squawk" = "2.72.0"
shellcheck = "0.11.0"
hadolint = "2.15.1"
typos = "1.52.2"
"github:oasdiff/oasdiff" = "1.37.0"
"github:agent-sh/agnix" = "0.61.0"

[tasks.lint]
description = "Run all static and diff-based repository gates"
run = "just lint"

[tasks.check]
description = "Run every check CI enforces"
run = "just check"
