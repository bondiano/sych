schema_version: 1
rules:
  - id: EFFECT-01
    version: 1
    title: Preserve the required effects of an operation
    kind: invariant
    required: true
    severity_on_violation: high
    owner: backend
    applies_to:
      paths: ["backend/orders/**"]
      change_kinds: ["call_change", "control_flow_change", "move"]
    statement: >
      A successful order write keeps the required event publication
      according to the accepted operation contract.
    rationale: "Consumers must receive an event about a saved order."
    contract_refs: [".sych/contracts/order-created.md"]
    acceptance:
      evidence_kinds: ["source", "semantic", "test"]
      criteria:
        - "The commit boundary and the delivery mechanism are defined."
        - "Failure, retry and a stop between the write and the delivery are checked."
    # Scoped waiver: the status stays VIOLATED/UNKNOWN, only the risk decision changes.
    exceptions:
      - paths: ["backend/orders/legacy_import/**"]
        reason: "The old order import does not publish the event; it is removed after clients migrate."
        owner: backend
        author: orders-team
        expires_at: null
        until: "legacy_import is removed"
  - id: NAMING-01
    version: 1
    title: Names reflect the domain
    kind: preference
    required: false
    owner: backend
    statement: New public names use terms from the project glossary.
