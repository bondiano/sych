schema_version: 1
id: ts-path-traversal-safe
split: development
language: typescript
pair: ts-path-traversal
variant: safe
profiles: [correctness]
rationale: "The download route resolves the requested name and rejects any path that does not stay strictly inside UPLOAD_DIR before sending it."
base:
  package.json: |
    {
      "name": "shop",
      "private": true,
      "packageManager": "pnpm@12.14.0",
      "dependencies": {
        "express": "^5.1.0"
      }
    }
  tsconfig.json: |
    {
      "compilerOptions": { "strict": true, "jsx": "react-jsx", "module": "esnext", "moduleResolution": "bundler" }
    }
  src/routes/files.ts: |
    import { readdir } from 'node:fs/promises';
    import path from 'node:path';
    import { Router } from 'express';

    const UPLOAD_DIR = path.resolve(process.env.UPLOAD_DIR ?? 'uploads');

    export const files = Router();

    files.get('/files', async (_req, res) => {
      res.json(await readdir(UPLOAD_DIR));
    });
head:
  src/routes/files.ts: |
    import { readdir } from 'node:fs/promises';
    import path from 'node:path';
    import { Router } from 'express';

    const UPLOAD_DIR = path.resolve(process.env.UPLOAD_DIR ?? 'uploads');

    export const files = Router();

    files.get('/files', async (_req, res) => {
      res.json(await readdir(UPLOAD_DIR));
    });

    files.get('/files/download', (req, res) => {
      const target = path.resolve(UPLOAD_DIR, String(req.query.name));
      if (!target.startsWith(UPLOAD_DIR + path.sep)) {
        res.status(400).send('invalid file name');
        return;
      }
      res.download(target);
    });
expected:
  forbidden_claims:
    - "The download route allows path traversal outside UPLOAD_DIR."
