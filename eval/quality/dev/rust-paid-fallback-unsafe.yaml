schema_version: 1
id: rust-paid-fallback-unsafe
split: development
language: rust
pair: rust-paid-fallback
variant: unsafe
profiles: [correctness]
rationale: "Quota exhaustion now takes the first healthy route, which may be billed per request."
base:
  Cargo.toml: |
    [package]
    name = "gateway"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  .sych/rules.yaml: |
    schema_version: 1
    rules:
      - id: ROUTE-01
        version: 1
        title: Quota exhaustion never reaches a paid route
        kind: invariant
        required: true
        severity_on_violation: high
        owner: platform
        applies_to:
          paths: ["src/**"]
        statement: When a subscription route reports exhausted quota, the request does not move to a route billed as paid API usage.
  src/lib.rs: |
    pub fn next_route<'a>(failure: &Failure, chain: &'a [Route]) -> Option<&'a Route> {
        match failure {
            Failure::RateLimited | Failure::Transient => chain
                .iter()
                .find(|r| r.healthy && r.billing == Billing::Subscription),
            Failure::QuotaExhausted => None,
            Failure::Auth | Failure::Schema => None,
        }
    }
head:
  src/lib.rs: |
    pub fn next_route<'a>(failure: &Failure, chain: &'a [Route]) -> Option<&'a Route> {
        match failure {
            Failure::RateLimited | Failure::Transient => chain
                .iter()
                .find(|r| r.healthy && r.billing == Billing::Subscription),
            Failure::QuotaExhausted => chain.iter().find(|r| r.healthy),
            Failure::Auth | Failure::Schema => None,
        }
    }
expected:
  obligations:
    - { rule_id: ROUTE-01, expected_status: VIOLATED }
  findings:
    - category: defect
      semantic_target: "fallback after quota exhaustion"
      required_condition: "the first healthy route in the chain is billed as API usage"
      evidence_locations:
        - { side: HEAD, path: src/lib.rs, start_line: 6, end_line: 6 }
  forbidden_claims:
    - "Quota exhaustion still stops the request."
