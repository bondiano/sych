schema_version: 1
id: rust-blocking-in-async-safe
split: development
language: rust
pair: rust-blocking-in-async
variant: safe
profiles: [correctness]
rationale: "The backoff uses tokio::time::sleep and yields to the executor."
base:
  Cargo.toml: |
    [package]
    name = "orders"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  src/lib.rs: |
    pub async fn send_with_retry(client: &Client, request: Request) -> Result<Response, Error> {
        for attempt in 0..3 {
            match client.send(&request).await {
                Ok(response) => return Ok(response),
                Err(_) if attempt < 2 => continue,
                Err(e) => return Err(e),
            }
        }
        unreachable!()
    }
