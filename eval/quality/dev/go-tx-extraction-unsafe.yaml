schema_version: 1
id: go-tx-extraction-unsafe
split: development
language: go
pair: go-tx-extraction
variant: unsafe
profiles: [correctness, side_effects]
rationale: "The ledger insert moves into a helper that writes through s.db instead of the transaction: the SQL is unchanged, but the row is committed on its own and survives a rollback of the order (spec §12.4, Go transaction extraction)."
base:
  go.mod: |
    module example.com/shop

    go 1.26
  orders/create.go: |
    package orders

    import (
    	"context"
    	"database/sql"
    )

    type Store struct {
    	db *sql.DB
    }

    func (s *Store) Create(ctx context.Context, id string, total int) error {
    	tx, err := s.db.BeginTx(ctx, nil)
    	if err != nil {
    		return err
    	}
    	defer tx.Rollback()
    	if _, err := tx.ExecContext(ctx, "INSERT INTO orders (id) VALUES ($1)", id); err != nil {
    		return err
    	}
    	if _, err := tx.ExecContext(ctx, "INSERT INTO ledger (order_id, total) VALUES ($1, $2)", id, total); err != nil {
    		return err
    	}
    	return tx.Commit()
    }
head:
  orders/create.go: |
    package orders

    import (
    	"context"
    	"database/sql"
    )

    type Store struct {
    	db *sql.DB
    }

    func (s *Store) Create(ctx context.Context, id string, total int) error {
    	tx, err := s.db.BeginTx(ctx, nil)
    	if err != nil {
    		return err
    	}
    	defer tx.Rollback()
    	if _, err := tx.ExecContext(ctx, "INSERT INTO orders (id) VALUES ($1)", id); err != nil {
    		return err
    	}
    	if err := s.addLedger(ctx, id, total); err != nil {
    		return err
    	}
    	return tx.Commit()
    }

    func (s *Store) addLedger(ctx context.Context, id string, total int) error {
    	_, err := s.db.ExecContext(ctx, "INSERT INTO ledger (order_id, total) VALUES ($1, $2)", id, total)
    	return err
    }
expected:
  findings:
    - category: defect
      semantic_target: "atomicity of the ledger insert with the order transaction"
      required_condition: "the commit fails or the transaction rolls back after addLedger ran"
      evidence_locations:
        - { side: HEAD, path: orders/create.go, start_line: 27, end_line: 29 }
  facts:
    - { kind: db_call, side: HEAD, path: orders/create.go, line: 28 }
    - { kind: tx_boundary, side: HEAD, path: orders/create.go, line: 13 }
  forbidden_claims:
    - "The SQL is unchanged, so behaviour is preserved."
