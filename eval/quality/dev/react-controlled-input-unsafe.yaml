schema_version: 1
id: react-controlled-input-unsafe
split: development
language: typescript
pair: react-controlled-input
variant: unsafe
profiles: [correctness]
rationale: "value without onChange makes the field read-only: typing does nothing and React warns."
base:
  package.json: |
    {
      "name": "shop",
      "private": true,
      "packageManager": "pnpm@12.14.0"
    }
  tsconfig.json: |
    {
      "compilerOptions": { "strict": true, "jsx": "react-jsx", "module": "esnext", "moduleResolution": "bundler" }
    }
  src/PromoForm.tsx: |
    import { useState } from 'react';

    export function PromoForm({ onApply }: { onApply: (code: string) => void }) {
      const [code, setCode] = useState('');
      const submit = (event: React.FormEvent) => {
        event.preventDefault();
        onApply(code);
      };
      return (
        <form onSubmit={submit}>
          <input value={code} onChange={(e) => setCode(e.target.value)} />
          <button type="submit">Apply</button>
        </form>
      );
    }
head:
  src/PromoForm.tsx: |
    import { useState } from 'react';

    export function PromoForm({ onApply }: { onApply: (code: string) => void }) {
      const [code, setCode] = useState('');
      const submit = (event: React.FormEvent) => {
        event.preventDefault();
        onApply(code);
      };
      return (
        <form onSubmit={submit}>
          <input value={code} />
          <button type="submit">Apply</button>
        </form>
      );
    }
expected:
  findings:
    - category: defect
      semantic_target: "promo code input editability"
      required_condition: "the user types a code"
      evidence_locations:
        - { side: HEAD, path: src/PromoForm.tsx, start_line: 11, end_line: 11 }
  facts:
    - { kind: controlled_without_handler, side: HEAD, path: src/PromoForm.tsx, line: 11 }
