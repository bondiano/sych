schema_version: 1
id: rust-result-propagation-unknown
split: development
language: rust
pair: rust-result-propagation
variant: unknown
profiles: [correctness]
rationale: "The publish result goes into a macro defined outside the snapshot; whether it propagates or only logs is not visible without expansion."
base:
  Cargo.toml: |
    [package]
    name = "orders"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  .sych/rules.yaml: |
    schema_version: 1
    rules:
      - id: EFFECT-01
        version: 1
        title: Stored order publishes order-created
        kind: invariant
        required: true
        severity_on_violation: high
        owner: backend
        applies_to:
          paths: ["src/**"]
        statement: A stored order publishes order-created, and a failed publication fails the save.
  src/lib.rs: |
    pub struct Store {
        db: Db,
        bus: Bus,
    }

    impl Store {
        pub fn save(&self, order: &Order) -> Result<(), Error> {
            self.db.insert(order)?;
            self.bus.publish(OrderCreated::from(order))?;
            Ok(())
        }
    }
head:
  src/lib.rs: |
    pub struct Store {
        db: Db,
        bus: Bus,
    }

    impl Store {
        pub fn save(&self, order: &Order) -> Result<(), Error> {
            self.db.insert(order)?;
            log_err!(self.bus.publish(OrderCreated::from(order)));
            Ok(())
        }
    }
expected:
  obligations:
    - { rule_id: EFFECT-01, expected_status: UNKNOWN }
  facts:
    - { kind: unexpanded_macro, side: HEAD, path: src/lib.rs, line: 9 }
  forbidden_claims:
    - "The publish error is ignored."
    - "The publish error is propagated."
  unknown: "log_err! is not expanded, so it is unknown whether a publish failure still fails the save."
