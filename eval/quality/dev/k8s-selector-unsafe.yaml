schema_version: 1
id: k8s-selector-unsafe
split: development
language: kubernetes
pair: k8s-selector
variant: unsafe
profiles: [infrastructure]
rationale: "The pod template label was renamed but the Deployment selector was not: the new ReplicaSet's pods do not match the selector, the API rejects the update, and the Service keeps routing to old pods only (spec §14.2, selectors and labels)."
base:
  k8s/web.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers:
            - name: app
              image: ghcr.io/shop/web:1.4.0
              readinessProbe: {httpGet: {path: /healthz, port: 8080}}
head:
  k8s/web.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: website}}
        spec:
          containers:
            - name: app
              image: ghcr.io/shop/web:1.5.0
              readinessProbe: {httpGet: {path: /healthz, port: 8080}}
ci:
  rendered.yaml: |
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: website}}
        spec:
          containers:
            - name: app
              image: ghcr.io/shop/web:1.5.0
              readinessProbe: {httpGet: {path: /healthz, port: 8080}}
expected:
  obligations:
    - { rule_id: K8S-ROLLOUT, expected_status: VIOLATED }
  findings:
    - category: defect
      semantic_target: "the web Deployment's selector and pod template labels"
      required_condition: "the manifest is applied with app: web in the selector and app: website on the pods"
      evidence_locations:
        - { side: HEAD, path: k8s/web.yaml, start_line: 6, end_line: 8 }
  forbidden_claims:
    - "The rollout was observed to succeed."
