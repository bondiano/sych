schema_version: 1
id: go-path-traversal-safe
split: development
language: go
pair: go-path-traversal
variant: safe
profiles: [correctness]
rationale: "The name is served only when filepath.IsLocal accepts it (no `..` escape, not absolute, not empty), so the joined path stays inside reportsDir."
base:
  go.mod: |
    module example.com/reports

    go 1.24
  reports.go: |
    package reports

    import (
    	"fmt"
    	"net/http"
    	"path/filepath"
    	"strconv"
    )

    const reportsDir = "/srv/reports"

    func Download(w http.ResponseWriter, r *http.Request) {
    	id, err := strconv.Atoi(r.URL.Query().Get("id"))
    	if err != nil {
    		http.Error(w, "bad id", http.StatusBadRequest)
    		return
    	}
    	http.ServeFile(w, r, filepath.Join(reportsDir, fmt.Sprintf("%d.pdf", id)))
    }
head:
  reports.go: |
    package reports

    import (
    	"net/http"
    	"path/filepath"
    )

    const reportsDir = "/srv/reports"

    func Download(w http.ResponseWriter, r *http.Request) {
    	name := r.URL.Query().Get("name")
    	if !filepath.IsLocal(name) {
    		http.Error(w, "bad name", http.StatusBadRequest)
    		return
    	}
    	http.ServeFile(w, r, filepath.Join(reportsDir, name))
    }
expected:
  tolerated:
    - semantic_target: "the endpoint now takes a file name instead of a numeric id: old ?id= requests get 400 and any file under reportsDir is servable"
      evidence_locations:
        - { side: HEAD, path: reports.go, start_line: 11, end_line: 11 }
  forbidden_claims:
    - "Download allows path traversal."
