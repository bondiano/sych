schema_version: 1
id: rust-path-traversal-unsafe
split: development
language: rust
pair: rust-path-traversal
variant: unsafe
profiles: [correctness]
rationale: "The avatar route now takes a free-form file name and joins it onto AVATAR_DIR: axum percent-decodes the segment, so `..%2F..%2Fetc%2Fpasswd` (or an absolute path, which replaces the base in `join`) reads any file."
base:
  Cargo.toml: |
    [package]
    name = "avatars"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
    axum = "0.8"
    tokio = { version = "1", features = ["fs"] }
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  src/lib.rs: |
    use std::path::Path as FsPath;

    use axum::extract::Path;
    use axum::http::StatusCode;

    const AVATAR_DIR: &str = "/var/lib/app/avatars";

    pub async fn avatar(Path(user_id): Path<u64>) -> Result<Vec<u8>, StatusCode> {
        let file = FsPath::new(AVATAR_DIR).join(format!("{user_id}.png"));
        tokio::fs::read(file).await.map_err(|_| StatusCode::NOT_FOUND)
    }
head:
  src/lib.rs: |
    use std::path::Path as FsPath;

    use axum::extract::Path;
    use axum::http::StatusCode;

    const AVATAR_DIR: &str = "/var/lib/app/avatars";

    pub async fn avatar(Path(name): Path<String>) -> Result<Vec<u8>, StatusCode> {
        let file = FsPath::new(AVATAR_DIR).join(&name);
        tokio::fs::read(file).await.map_err(|_| StatusCode::NOT_FOUND)
    }
expected:
  findings:
    - category: defect
      semantic_target: "files read by the avatar handler stay inside AVATAR_DIR"
      required_condition: "the name segment decodes to `..` components or an absolute path"
      evidence_locations:
        - { side: HEAD, path: src/lib.rs, start_line: 9, end_line: 10 }
  forbidden_claims:
    - "The handler only reads files inside AVATAR_DIR."
