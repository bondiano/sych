schema_version: 1
id: ts-api-removal-unsafe
split: development
language: typescript
pair: ts-api-removal
variant: unsafe
profiles: [correctness, migration_compatibility]
rationale: "formatPrice is removed while Checkout still imports it."
base:
  package.json: |
    {
      "name": "shop",
      "private": true,
      "packageManager": "pnpm@12.14.0"
    }
  tsconfig.json: |
    {
      "compilerOptions": { "strict": true, "jsx": "react-jsx", "module": "esnext", "moduleResolution": "bundler" }
    }
  src/lib/price.ts: |
    export function formatPrice(cents: number): string {
      return (cents / 100).toFixed(2);
    }

    export function formatTotal(cents: number, currency: string): string {
      return `${formatPrice(cents)} ${currency}`;
    }
  src/pages/Checkout.tsx: |
    import { formatPrice } from '../lib/price';

    export function Checkout({ cents }: { cents: number }) {
      return <strong>{formatPrice(cents)}</strong>;
    }
head:
  src/lib/price.ts: |
    export function formatTotal(cents: number, currency: string): string {
      return `${(cents / 100).toFixed(2)} ${currency}`;
    }
expected:
  findings:
    - category: defect
      semantic_target: "formatPrice consumers"
      required_condition: "the checkout page is built"
      evidence_locations:
        - { side: HEAD, path: src/pages/Checkout.tsx, start_line: 1, end_line: 1 }
        - { side: DIFF_BASE, path: src/lib/price.ts, start_line: 1, end_line: 3 }
