schema_version: 1
id: rust-paid-fallback-unknown
split: development
language: rust
pair: rust-paid-fallback
variant: unknown
profiles: [correctness]
rationale: "Quota exhaustion is delegated to a policy crate outside the snapshot."
base:
  Cargo.toml: |
    [package]
    name = "gateway"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  .sych/rules.yaml: |
    schema_version: 1
    rules:
      - id: ROUTE-01
        version: 1
        title: Quota exhaustion never reaches a paid route
        kind: invariant
        required: true
        severity_on_violation: high
        owner: platform
        applies_to:
          paths: ["src/**"]
        statement: When a subscription route reports exhausted quota, the request does not move to a route billed as paid API usage.
  src/lib.rs: |
    pub fn next_route<'a>(failure: &Failure, chain: &'a [Route]) -> Option<&'a Route> {
        match failure {
            Failure::RateLimited | Failure::Transient => chain
                .iter()
                .find(|r| r.healthy && r.billing == Billing::Subscription),
            Failure::QuotaExhausted => None,
            Failure::Auth | Failure::Schema => None,
        }
    }
head:
  src/lib.rs: |
    pub fn next_route<'a>(failure: &Failure, chain: &'a [Route]) -> Option<&'a Route> {
        match failure {
            Failure::RateLimited | Failure::Transient => chain
                .iter()
                .find(|r| r.healthy && r.billing == Billing::Subscription),
            Failure::QuotaExhausted => route_policy::on_quota_exhausted(chain),
            Failure::Auth | Failure::Schema => None,
        }
    }
expected:
  obligations:
    - { rule_id: ROUTE-01, expected_status: UNKNOWN }
  forbidden_claims:
    - "Quota exhaustion falls back to a paid route."
    - "Quota exhaustion still stops the request."
  unknown: "route_policy::on_quota_exhausted is not in the snapshot, so which route it picks is unknown."
