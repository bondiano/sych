schema_version: 1
id: old-frontend-field-removal-unsafe
split: development
language: go
pair: old-frontend-field-removal
variant: unsafe
profiles: [correctness, migration_compatibility]
rationale: "The API stops returning legacy_status and the column is dropped in the same release; the new frontend no longer reads it, but tabs opened before the release run the old bundle, which renders order.legacy_status, for the declared 14-day window."
base:
  .sych/deploy.yaml: |
    schema_version: 1
    environment: production
    owner: orders
    order: {value: [schema, app, frontend], source: deploy/README.md}
    mixed_versions: {value: true, source: "rolling update"}
    compatibility_window: {value: 14d, source: "frontend release policy: open tabs live up to 14 days"}
    initial_versions:
      value: {app_image: "ghcr.io/shop/api@sha256:aaaa", source_commit: "1111111111111111111111111111111111111111", supported_clients: ["web bundles of the last 14 days"]}
      source: argocd
    recovery: {value: roll_forward_repair, source: runbook}
  go.mod: |
    module example.com/shop

    go 1.26
  migrations/0001_orders.sql: |
    CREATE TABLE orders (id TEXT PRIMARY KEY, legacy_status TEXT NOT NULL);
  api/order.go: |
    package api

    type Order struct {
    	ID           string `json:"id"`
    	LegacyStatus string `json:"legacy_status"`
    }
  web/order.ts: |
    export function label(order: { id: string; legacy_status: string }): string {
      return `${order.id}: ${order.legacy_status.toUpperCase()}`;
    }
head:
  migrations/0002_drop_legacy_status.sql: |
    ALTER TABLE orders DROP COLUMN legacy_status;
  api/order.go: |
    package api

    type Order struct {
    	ID string `json:"id"`
    }
  web/order.ts: |
    export function label(order: { id: string }): string {
      return order.id;
    }
expected:
  obligations:
    - { rule_id: MIG-CONTRACT, expected_status: VIOLATED }
  findings:
    - category: defect
      semantic_target: "legacy_status read by frontend bundles opened before the release"
      required_condition: "a browser tab opened before the release calls the new API within the 14-day window"
      evidence_locations:
        - { side: HEAD, path: api/order.go, start_line: 3, end_line: 5 }
        - { side: DIFF_BASE, path: web/order.ts, start_line: 2, end_line: 2 }
  forbidden_claims:
    - "No client reads legacy_status any more, so removing it is safe."
