schema_version: 1
id: react-xss-dangerous-html-safe
split: development
language: typescript
pair: react-xss-dangerous-html
variant: safe
profiles: [correctness]
rationale: "The Markdown output is sanitised with DOMPurify before it reaches dangerouslySetInnerHTML, so user HTML cannot run script."
base:
  package.json: |
    {
      "name": "shop",
      "private": true,
      "packageManager": "pnpm@12.14.0",
      "dependencies": {
        "react": "^19.1.0",
        "marked": "^15.0.0",
        "dompurify": "^3.2.0"
      }
    }
  tsconfig.json: |
    {
      "compilerOptions": { "strict": true, "jsx": "react-jsx", "module": "esnext", "moduleResolution": "bundler" }
    }
  src/Comment.tsx: |
    type CommentProps = { author: string; body: string };

    export function Comment({ author, body }: CommentProps) {
      return (
        <article>
          <h4>{author}</h4>
          <p>{body}</p>
        </article>
      );
    }
head:
  src/Comment.tsx: |
    import DOMPurify from 'dompurify';
    import { marked } from 'marked';

    type CommentProps = { author: string; body: string };

    export function Comment({ author, body }: CommentProps) {
      const html = DOMPurify.sanitize(marked.parse(body, { async: false }));
      return (
        <article>
          <h4>{author}</h4>
          <div className="markdown" dangerouslySetInnerHTML={{ __html: html }} />
        </article>
      );
    }
expected:
  forbidden_claims:
    - "The comment body is rendered as unsanitised HTML (XSS)."
