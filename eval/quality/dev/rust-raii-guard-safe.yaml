schema_version: 1
id: rust-raii-guard-safe
split: development
language: rust
pair: rust-raii-guard
variant: safe
profiles: [correctness]
rationale: "Only the guard binding is renamed; it lives until the end of the function as before."
base:
  Cargo.toml: |
    [package]
    name = "orders"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  src/lib.rs: |
    use std::sync::Mutex;

    pub struct Ledger {
        entries: Mutex<Vec<Entry>>,
    }

    impl Ledger {
        pub fn append(&self, entry: Entry) {
            let mut entries = self.entries.lock().unwrap();
            entries.push(entry);
            entries.sort_by_key(|e| e.at);
        }
    }
