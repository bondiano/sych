schema_version: 1
id: rust-retry-idempotency-unsafe
split: development
language: rust
pair: rust-retry-idempotency
variant: unsafe
profiles: [correctness, side_effects]
rationale: "settle now retries a charge that timed out, but Gateway::charge, not part of the change, posts without an idempotency key and a timeout does not say whether the provider applied the charge: a retry can charge the customer twice."
base:
  Cargo.toml: |
    [package]
    name = "billing"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  src/lib.rs: |
    pub mod billing;
    pub mod gateway;
    pub mod http;
  src/http.rs: |
    use crate::gateway::GatewayError;

    pub struct Client;

    impl Client {
        pub fn post(&self, _path: &str, _body: &str, _headers: &[(&str, &str)]) -> Result<(), GatewayError> {
            Ok(())
        }
    }
  src/billing.rs: |
    use crate::gateway::{Gateway, GatewayError};

    pub fn settle(gateway: &Gateway, order_id: &str, cents: u64) -> Result<(), GatewayError> {
        gateway.charge(order_id, cents)
    }
  src/gateway.rs: |
    #[derive(Debug)]
    pub enum GatewayError {
        Timeout,
        Declined,
    }

    pub struct Gateway {
        pub client: crate::http::Client,
    }

    impl Gateway {
        /// Posts a charge. A timeout does not say whether the provider applied it.
        pub fn charge(&self, order_id: &str, cents: u64) -> Result<(), GatewayError> {
            let body = format!("{{\"order\":\"{order_id}\",\"amount\":{cents}}}");
            self.client.post("/charges", &body, &[])
        }
    }
head:
  src/billing.rs: |
    use crate::gateway::{Gateway, GatewayError};

    /// A timed-out charge is retried up to three times.
    pub fn settle(gateway: &Gateway, order_id: &str, cents: u64) -> Result<(), GatewayError> {
        let mut attempt = 0;
        loop {
            match gateway.charge(order_id, cents) {
                Err(GatewayError::Timeout) if attempt < 3 => attempt += 1,
                other => return other,
            }
        }
    }
expected:
  findings:
    - category: defect
      semantic_target: "charging an order at most once"
      required_condition: "the provider applies a charge whose response times out"
      evidence_locations:
        - { side: HEAD, path: src/billing.rs, start_line: 6, end_line: 10 }
        - { side: HEAD, path: src/gateway.rs, start_line: 13, end_line: 15 }
  forbidden_claims:
    - "The charge carries an idempotency key."

