schema_version: 1
id: rust-trait-api-safe
split: development
language: rust
pair: rust-trait-api
variant: safe
profiles: [correctness]
rationale: "A provided trait method is added; existing implementors and callers are unaffected."
base:
  Cargo.toml: |
    [package]
    name = "orders"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  src/lib.rs: |
    pub mod api;
    pub mod store;
  src/store.rs: |
    pub trait OrderStore {
        fn find(&self, id: OrderId) -> Result<Option<Order>, StoreError>;
    }

    impl OrderStore for Postgres {
        fn find(&self, id: OrderId) -> Result<Option<Order>, StoreError> {
            self.query_one(id)
        }
    }
  src/api.rs: |
    pub fn show(store: &impl OrderStore, id: OrderId) -> Result<Page, StoreError> {
        match store.find(id)? {
            Some(order) => Ok(Page::order(order)),
            None => Ok(Page::not_found()),
        }
    }
head:
  src/store.rs: |
    pub trait OrderStore {
        fn find(&self, id: OrderId) -> Result<Option<Order>, StoreError>;

        fn exists(&self, id: OrderId) -> Result<bool, StoreError> {
            Ok(self.find(id)?.is_some())
        }
    }

    impl OrderStore for Postgres {
        fn find(&self, id: OrderId) -> Result<Option<Order>, StoreError> {
            self.query_one(id)
        }
    }
expected:
  facts:
    - { kind: public_item, side: HEAD, path: src/store.rs, line: 1 }
  forbidden_claims:
    - "Existing implementors must change."
