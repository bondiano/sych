schema_version: 1
id: rust-async-cancellation-safe
split: development
language: rust
pair: rust-async-cancellation
variant: safe
profiles: [correctness]
rationale: "Both branches are channel receives, which are cancel-safe; losing the race drops no data."
base:
  Cargo.toml: |
    [package]
    name = "orders"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  src/lib.rs: |
    pub async fn pump(mut socket: Socket, mut stop: Receiver<()>) -> Result<(), Error> {
        loop {
            let frame = read_frame(&mut socket).await?;
            handle(frame)?;
            if stop.try_recv().is_ok() {
                return Ok(());
            }
        }
    }

    async fn read_frame(socket: &mut Socket) -> Result<Frame, Error> {
        let mut len = [0u8; 4];
        socket.read_exact(&mut len).await?;
        let mut body = vec![0u8; u32::from_be_bytes(len) as usize];
        socket.read_exact(&mut body).await?;
        Frame::decode(&body)
    }
head:
  src/lib.rs: |
    pub async fn pump(mut frames: Receiver<Frame>, mut stop: Receiver<()>) -> Result<(), Error> {
        loop {
            tokio::select! {
                frame = frames.recv() => match frame {
                    Some(frame) => handle(frame)?,
                    None => return Ok(()),
                },
                _ = stop.recv() => return Ok(()),
            }
        }
    }
expected:
  tolerated:
    - semantic_target: "a dropped stop sender now ends the pump instead of being ignored"
      evidence_locations:
        - { side: HEAD, path: src/lib.rs, start_line: 8, end_line: 8 }
  facts:
    - { kind: select_macro, side: HEAD, path: src/lib.rs, line: 3 }
  forbidden_claims:
    - "A frame can be lost when select! picks another branch."
