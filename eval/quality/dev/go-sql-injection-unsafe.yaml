schema_version: 1
id: go-sql-injection-unsafe
split: development
language: go
pair: go-sql-injection
variant: unsafe
profiles: [correctness]
rationale: "Posts are now filtered by author with fmt.Sprintf into the SQL text: an author value containing `'` injects arbitrary SQL."
base:
  go.mod: |
    module example.com/posts

    go 1.24
  posts.go: |
    package posts

    import "database/sql"

    type Post struct {
    	ID    int64
    	Title string
    }

    func Recent(db *sql.DB) ([]Post, error) {
    	rows, err := db.Query("SELECT id, title FROM posts ORDER BY created_at DESC LIMIT 20")
    	if err != nil {
    		return nil, err
    	}
    	defer rows.Close()
    	return scan(rows)
    }
head:
  posts.go: |
    package posts

    import (
    	"database/sql"
    	"fmt"
    )

    type Post struct {
    	ID    int64
    	Title string
    }

    func Recent(db *sql.DB) ([]Post, error) {
    	rows, err := db.Query("SELECT id, title FROM posts ORDER BY created_at DESC LIMIT 20")
    	if err != nil {
    		return nil, err
    	}
    	defer rows.Close()
    	return scan(rows)
    }

    func ByAuthor(db *sql.DB, author string) ([]Post, error) {
    	query := fmt.Sprintf("SELECT id, title FROM posts WHERE author = '%s' ORDER BY created_at DESC", author)
    	rows, err := db.Query(query)
    	if err != nil {
    		return nil, err
    	}
    	defer rows.Close()
    	return scan(rows)
    }
expected:
  findings:
    - category: defect
      semantic_target: "SQL executed by ByAuthor"
      required_condition: "the author contains a single quote"
      evidence_locations:
        - { side: HEAD, path: posts.go, start_line: 23, end_line: 24 }
  forbidden_claims:
    - "ByAuthor uses placeholders."
