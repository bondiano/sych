schema_version: 1
id: rust-log-secrets-safe
split: development
language: rust
pair: rust-log-secrets
variant: safe
profiles: [correctness]
rationale: "The debug line gains the attempt id only; no key or body."
base:
  Cargo.toml: |
    [package]
    name = "gateway"
    version = "0.1.0"
    edition = "2024"

    [dependencies]
  rust-toolchain.toml: |
    [toolchain]
    channel = "1.94.1"
  .sych/rules.yaml: |
    schema_version: 1
    rules:
      - id: PRIV-01
        version: 1
        title: No credentials or prompt text in logs
        kind: invariant
        required: true
        severity_on_violation: high
        owner: platform
        applies_to:
          paths: ["src/**"]
        statement: The provider API key and the request body (prompt text) are never written to logs.
  src/lib.rs: |
    impl Client {
        pub async fn send(&self, request: &Request) -> Result<Reply, Error> {
            tracing::debug!(model = %request.model, bytes = request.body.len(), "dispatch");
            let response = self
                .http
                .post(&self.url)
                .bearer_auth(&self.api_key)
                .body(request.body.clone())
                .send()
                .await?;
            Reply::read(response).await
        }
    }
head:
  src/lib.rs: |
    impl Client {
        pub async fn send(&self, request: &Request) -> Result<Reply, Error> {
            tracing::debug!(model = %request.model, attempt = %request.attempt_id, bytes = request.body.len(), "dispatch");
            let response = self
                .http
                .post(&self.url)
                .bearer_auth(&self.api_key)
                .body(request.body.clone())
                .send()
                .await?;
            Reply::read(response).await
        }
    }
expected:
  obligations:
    - { rule_id: PRIV-01, expected_status: SUPPORTED }
  forbidden_claims:
    - "The API key is logged."
