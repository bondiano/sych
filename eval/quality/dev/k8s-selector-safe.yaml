schema_version: 1
id: k8s-selector-safe
split: development
language: kubernetes
pair: k8s-selector
variant: safe
profiles: [infrastructure]
rationale: "Only the image tag changes; selector and labels still match and the readiness probe gates the rolling update."
base:
  k8s/web.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers:
            - name: app
              image: ghcr.io/shop/web:1.4.0
              readinessProbe: {httpGet: {path: /healthz, port: 8080}}
head:
  k8s/web.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers:
            - name: app
              image: ghcr.io/shop/web:1.5.0
              readinessProbe: {httpGet: {path: /healthz, port: 8080}}
ci:
  rendered.yaml: |
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: web}
    spec:
      replicas: 2
      selector: {matchLabels: {app: web}}
      template:
        metadata: {labels: {app: web}}
        spec:
          containers:
            - name: app
              image: ghcr.io/shop/web:1.5.0
              readinessProbe: {httpGet: {path: /healthz, port: 8080}}
expected:
  obligations:
    - { rule_id: K8S-ROLLOUT, expected_status: SUPPORTED }
  forbidden_claims:
    - "The selector no longer matches the pods."
    - "The rollout was observed to succeed."
