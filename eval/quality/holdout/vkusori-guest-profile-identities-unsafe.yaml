pair: vkusori-guest-profile-identities
variant: unsafe
profiles: [correctness]
rationale: "The profile header now reads profileNameAtom, which always reads identitiesAtom, a server query of GET /api/v1/me/identities through the session client. ProfileHero mounts it for a guest too and only then ignores the name, so a guest, who has no account and whose diary is local-only, sends that request each time the profile opens."
