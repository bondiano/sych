  base_ref: "a349b4fba5a1c4903ca0900d24b5778a7c90ec1f~1"
  head_ref: "a349b4fba5a1c4903ca0900d24b5778a7c90ec1f"
expected:
  findings:
    - category: defect
      semantic_target: "profileNameAtom subscribes to identitiesAtom unconditionally, so the profile header queries the server's identities endpoint even for a guest, whose name it never shows"
      required_condition: "a guest (no registered session) opens the profile: ProfileHero reads profileNameAtom, which mounts identitiesAtom and sends GET /api/v1/me/identities, a request a guest cannot use and an offline guest should not make"
