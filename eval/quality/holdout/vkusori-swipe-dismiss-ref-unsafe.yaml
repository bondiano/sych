schema_version: 1
id: vkusori-swipe-dismiss-ref-unsafe
split: holdout
language: typescript
variant: unsafe
profiles: [correctness, nitpicks]
rationale: "The new swipe-to-dismiss hook sets exitRef to the exit timer and never clears it, while onPointerDown ignores every press once exitRef is set; the hook lives in the always-mounted ToastRegion, so after the first animated swipe no later toast can be swiped. It also writes the callback ref during render, a nit (the later fix 280d692b1 came from a lint rule). The defect label was added after the first holdout run reported it."
repository_fixture:
  repo: vkusori
  base_ref: "19ca179d00700488b5e20a4fa13ec7560f3f4851~1"
  head_ref: "19ca179d00700488b5e20a4fa13ec7560f3f4851"
expected:
  findings:
    - category: defect
      semantic_target: "the swipe's exit timer handle stays in exitRef after the toast is dismissed, so useSwipeDismiss ignores every later pointer down"
      required_condition: "after one animated (not reduced-motion) swipe dismissal in the always-mounted ToastRegion: the next toast cannot be swiped away"
      evidence_locations:
        - { side: HEAD, path: apps/pwa/src/shared/lib/hooks/use-swipe-dismiss.ts, start_line: 74, end_line: 74 }
        - { side: HEAD, path: apps/pwa/src/shared/lib/hooks/use-swipe-dismiss.ts, start_line: 99, end_line: 99 }
    - category: nitpick
      semantic_target: "useSwipeDismiss writes the dismiss callback ref during render; React's rules ask to update refs after commit (in an effect)"
      required_condition: "always: the write runs on every render, including renders React discards"
      evidence_locations:
        - { side: HEAD, path: apps/pwa/src/shared/lib/hooks/use-swipe-dismiss.ts, start_line: 53, end_line: 54 }
