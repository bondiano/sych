# A pasted key instead of an environment variable name must be rejected without echoing it.
schema_version: 1
mode: personal
models:
  providers:
    openrouter:
      adapter: openrouter
      endpoint: "https://openrouter.ai/api/v1"
      api_key_env: "sk-or-v1-0123456789abcdef0123456789abcdef"
      allowed_modes: [personal_local]
