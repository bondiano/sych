name: Release

# A `v*` tag builds the CLI on native runners and drafts the GitHub release with the archives.
# The image is not rebuilt: the tag names the reviewer image image.yml built for the same commit.
# Run by hand for an existing tag when its push failed: a published tag is never moved.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, such as v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          # Native runners: aws-lc-sys, ring and the bundled SQLite need a C toolchain for the target.
          # Ubuntu 22.04 keeps the glibc floor at 2.35.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            rustup_sha256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            rustup_sha256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
          - target: aarch64-apple-darwin
            runner: macos-15
            rustup_sha256: 20ef5516c31b1ac2290084199ba77dbbcaa1406c45c1d978ca68558ef5964ef5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTUP_SHA256: ${{ matrix.rustup_sha256 }}
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -fsSL -o rustup-init \
              "https://static.rust-lang.org/rustup/archive/1.28.2/${TARGET}/rustup-init"
            echo "${RUSTUP_SHA256}  rustup-init" | shasum -a 256 -c -
            chmod +x rustup-init
            ./rustup-init -y --profile minimal --default-toolchain none
            rm -f rustup-init
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          cargo --version
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          SYCH_BUILD_COMMIT="$(git rev-parse HEAD)" \
            cargo build --release --locked -p sych-app --bin sych --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="${TAG#v}"
          bin="target/$TARGET/release/sych"
          test "$("$bin" --version)" = "sych $version"
          name="sych-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "$bin" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sych-${{ matrix.target }}
          path: dist/*.tar.gz*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # A draft: the notes are written and the release published by hand.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Sych ${TAG#v}" --notes "Release notes follow." dist/*

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the reviewer image of this commit
        run: |
          image=ghcr.io/bondiano/sych
          commit="$(git rev-parse HEAD)"
          if ! docker buildx imagetools inspect "$image:$commit" >/dev/null; then
            echo "::error::$image:$commit is missing; let image.yml finish on main first" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$image:${TAG#v}" "$image:$commit"
          echo "$image:${TAG#v}" >> "$GITHUB_STEP_SUMMARY"
