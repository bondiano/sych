name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Full debug info made `just check` and the PostgreSQL contracts 23 GB of target, and the
  # hosted runner ran out of disk; line tables keep file:line backtraces at 11 GB.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: docker.io/library/postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_PASSWORD: sych-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install CLI quality gates
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Ensure headless Chromium for report verification
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            cd web && pnpm install --frozen-lockfile && pnpm exec playwright-core install --with-deps chromium
          fi
      - name: Check
        id: check
        continue-on-error: true
        run: just check
      - name: PostgreSQL contracts
        id: postgres
        continue-on-error: true
        env:
          SYCH_TEST_POSTGRES_URL: postgres://postgres:sych-test@127.0.0.1:5432/postgres
        run: just test-postgres
      # Evidence for the Sych self-review (docs/SERVER.md#self-review-bondianosych).
      - name: Write Sych reports
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
          PG_OUTCOME: ${{ steps.postgres.outcome }}
        run: |
          cargo clippy --workspace --all-targets --all-features --locked --message-format=json > clippy.json || true
          code=$([ "$OUTCOME" = success ] && echo 0 || echo 1)
          pg_code=$([ "$PG_OUTCOME" = success ] && echo 0 || echo 1)
          printf '{"schema_version":1,"commands":[{"name":"just check","exit_code":%s},{"name":"just test-postgres","exit_code":%s}]}\n' "$code" "$pg_code" > outcomes.json
          printf '{"schema_version":1,"job":"github:%s/actions/runs/%s","tested_oid":"%s","toolchain":"%s","target":"x86_64-unknown-linux-gnu","features":["all"]}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" "$(rustc --version)" > sych-ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sych-reports
          path: |
            clippy.json
            outcomes.json
            sych-ci.json
          retention-days: 7
      - name: Fail when the check failed
        if: steps.check.outcome != 'success' || steps.postgres.outcome != 'success'
        run: exit 1
