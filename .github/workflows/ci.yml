name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked
      - uses: extractions/setup-just@v2
        with:
          just-version: "1.59.0"
      - name: Check
        id: check
        continue-on-error: true
        run: just check
      # Evidence for the Sych self-review (docs/SERVER.md#self-review-bondianosych).
      - name: Write Sych reports
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          cargo clippy --workspace --all-targets --all-features --locked --message-format=json > clippy.json || true
          code=$([ "$OUTCOME" = success ] && echo 0 || echo 1)
          printf '{"schema_version":1,"commands":[{"name":"just check","exit_code":%s}]}\n' "$code" > outcomes.json
          printf '{"schema_version":1,"job":"github:%s/actions/runs/%s","tested_oid":"%s","toolchain":"%s","target":"x86_64-unknown-linux-gnu","features":["all"]}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" "$(rustc --version)" > sych-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sych-reports
          path: |
            clippy.json
            outcomes.json
            sych-ci.json
          retention-days: 7
      - name: Fail when the check failed
        if: steps.check.outcome != 'success'
        run: exit 1
