name: Image

# Builds the reviewer image from main only; production runs the digest a human pins in petinfra,
# so a pull request can never replace the reviewer that reviews it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SYCH_BUILD_COMMIT=${{ github.sha }}
          tags: ghcr.io/bondiano/sych:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/bondiano/sych@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
