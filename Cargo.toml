[workspace]
resolver = "3"
members = ["crates/sych-adapters", "crates/sych-app", "crates/sych-core", "crates/sych-storage", "crates/sych-style"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
jiff = { version = "0.2.46", features = ["serde"] }
# SMTP over rustls with ring and webpki roots, as sqlx already uses them.
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
# Pure-Rust xz for pinned `.tar.xz` releases; the encoder and lzip are left out.
lzma-rust2 = { version = "0.26.0", default-features = false, features = ["std", "xz"] }
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_ast_visit = "0.139.0"
oxc_parser = "0.139.0"
oxc_span = "0.139.0"
oxc_syntax = "0.139.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quick-xml = "0.42.0"
quote = "1.0.47"
# Already in the graph through tracing-subscriber; its meta engine runs in linear time.
regex-automata = "0.4.19"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
schemars = { version = "1.2.3", features = ["jiff02", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.2"
sqlparser = { version = "0.64.0", default-features = false, features = ["std", "recursive-protection"] }
sqlx = { version = "0.9.1", default-features = false, features = ["any", "macros", "migrate", "mysql", "postgres", "runtime-tokio", "sqlite-bundled", "tls-rustls-ring-webpki"] }
sych-adapters = { path = "crates/sych-adapters" }
sych-core = { path = "crates/sych-core" }
sych-storage = { path = "crates/sych-storage" }
syn = { version = "3.0.10", features = ["full", "visit"] }
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
toml = "1.2.3"
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
absolute_paths = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
